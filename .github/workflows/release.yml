name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="agent-stride-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/as" "$staging/"
          cp "target/${{ matrix.target }}/release/as-eval" "$staging/"
          cp README.md LICENSE "$staging/"
          cp -r scripts "$staging/scripts"
          tar -cJf "$staging.tar.xz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-stride-${{ github.ref_name }}-${{ matrix.target }}
          path: agent-stride-*.tar.xz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum agent-stride-*.tar.xz > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "AgentStride $GITHUB_REF_NAME" \
            --notes-file ".github/releases/${GITHUB_REF_NAME}.md" \
            dist/*
