[package]
name = "agent-stride"
version = "0.1.0"
edition = "2024"
description = "A local-first runtime for reliable long-running Agent work"
license = "MIT"
readme = "README.md"

[dependencies]
async-openai = { version = "0.42.0", features = ["responses"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "time"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.7"
proptest = "1.6"
predicates = "3.1"
tempfile = "3.13"

[[bin]]
name = "as"
path = "src/main.rs"

[[bench]]
name = "engine"
harness = false
